{% extends "base.html" %}

{% block title %}{{ post['title'] }} – GHAS Demo Blog{% endblock %}

{% block content %}

        <h1>{{ post['title'] }}</h1>
        <p class="meta">By {{ post['author'] }}</p>
        <p>{{ post['body'] }}</p>
        <p><a href="/">← Back to blog</a></p>
    </article>
{% endblock %}
