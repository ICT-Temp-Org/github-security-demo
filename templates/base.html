<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GHAS Demo Blog{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 860px;
            margin: 0 auto;
            padding: 1rem 1.5rem 3rem;
            color: #24292f;
            background: #ffffff;
        }
        .banner-warning {
            background: #fff8c5;
            border: 2px solid #d4a017;
            border-radius: 6px;
            padding: 0.9rem 1.2rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .banner-warning strong { color: #9a6700; }
        nav { margin-bottom: 1.5rem; border-bottom: 1px solid #d0d7de; padding-bottom: 0.75rem; }
        nav a { font-weight: 600; color: #0969da; text-decoration: none; margin-right: 1rem; }
        nav a:hover { text-decoration: underline; }
        h1 { font-size: 1.75rem; }
        h2 { font-size: 1.35rem; }
        article { border-bottom: 1px solid #d0d7de; padding: 1rem 0; }
        article:last-child { border-bottom: none; }
        .meta { color: #656d76; font-size: 0.85rem; margin: 0.2rem 0 0.6rem; }
        .demo-routes { background: #fff1e5; border: 1px solid #fb8f44; border-radius: 6px;
                       padding: 0.9rem 1.2rem; margin-top: 2rem; font-size: 0.85rem; }
        .demo-routes summary { font-weight: 600; cursor: pointer; color: #953800; }
        .demo-routes ul { margin: 0.5rem 0 0; padding-left: 1.4rem; }
        .demo-routes code { background: #fff; border: 1px solid #d0d7de; border-radius: 3px;
                            padding: 0.1em 0.35em; font-size: 0.85em; }
        a { color: #0969da; }
    </style>
</head>
<body>
    <div class="banner-warning">
        ⚠️&nbsp; <strong>INTENTIONALLY VULNERABLE APPLICATION</strong>
        &nbsp;–&nbsp; For GitHub Advanced Security demonstration purposes only.
        Run exclusively on <code>127.0.0.1</code>.
        Do <strong>not</strong> deploy or expose to the internet.
    </div>

    <nav>
        <a href="/">🏠 Blog Home</a>
    </nav>

    {% block content %}{% endblock %}
</body>
</html>
